<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GucciBot</title>
<link rel="icon" type="image/jpeg" href="/static/images/gucci-mane.jpg">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    height: 100%;
  }
  video {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: contain;
  }
</style>
</head>
<body>
<video id="v" autoplay loop playsinline>
  <source src="https://github.com/guccimanefan/guccibot-site/releases/download/site-video/0901.1.mp4" type="video/mp4">
</video>
<script>
  // No controls attribute at all -- on purpose, this page is the whole gag.
  // Most browsers block autoplay-with-sound unless it follows a real user
  // gesture; this page is only ever reached via an actual click (see the
  // site-wide handler in static/js/guccibot.js), so try unmuted first and
  // only fall back to muted if the browser still blocks it.
  var v = document.getElementById('v');
  v.play().catch(function () {
    v.muted = true;
    v.play();
  });

  // Mobile fix, 2026-09-02 (Nigel: no audio on /dropped/ on mobile).
  // Real cause, not a bug in the sense of broken code: getting HERE
  // is a full page navigation (the site-wide click handler does
  // window.location.href), which doesn't count as a "user gesture" to
  // mobile browsers' autoplay-with-sound policy the way it does on
  // desktop -- iOS Safari in particular is far stricter than desktop
  // Chrome about this. So the unmuted play() above reliably fails on
  // phones and the muted fallback silently takes over -- the video
  // plays, just without sound, exactly what was reported. The one
  // thing mobile browsers DO honor is a genuine tap on the page
  // itself, so the very first tap/click anywhere on THIS page (still
  // no visible button -- same "nothing to click" feel as the rest of
  // the gag) unmutes and retries with sound.
  function unmuteOnFirstTouch() {
    v.muted = false;
    v.play().catch(function () {});
    document.removeEventListener('touchstart', unmuteOnFirstTouch);
    document.removeEventListener('click', unmuteOnFirstTouch);
  }
  document.addEventListener('touchstart', unmuteOnFirstTouch);
  document.addEventListener('click', unmuteOnFirstTouch);
</script>
</body>
</html>
